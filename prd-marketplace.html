<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marketplace · 交互式 PRD</title>
<link rel="stylesheet" href="design-system/colors_and_type.css">
<link rel="stylesheet" href="design-system/motion.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--th-bg);color:var(--color-fg);font-family:var(--th-font-cn);font-size:13px}
.mono{font-family:var(--th-font-mono);font-size:var(--th-text-xs)}

/* ================= 布局 ================= */
.topbar{position:sticky;top:0;z-index:var(--z-nav);height:48px;display:flex;align-items:center;gap:14px;
  padding:0 20px;background:color-mix(in srgb, var(--color-surface-nav) 88%, transparent);
  backdrop-filter:blur(50px);border-bottom:0.5px solid var(--color-divider)}
.tb-tile{width:24px;height:24px;border-radius:var(--th-radius-md);background:var(--brand-50);color:var(--brand-600);
  display:inline-flex;align-items:center;justify-content:center;font-size:14px}
.tb-title{font-family:var(--th-font-brand);font-weight:700;font-size:15px;letter-spacing:-.01em}
.tb-sub{font-size:11px;color:var(--color-fg-muted)}
.tb-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.tb-link{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 12px;border-radius:var(--th-radius-pill);
  font-size:12px;color:var(--color-fg);text-decoration:none;background:var(--color-surface-quiet);cursor:pointer;border:none}
.tb-link:hover{background:var(--color-surface-inset)}
.tb-link i{font-size:13px}

.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;max-width:1600px;margin:0 auto;padding:16px 24px 64px;align-items:start}
.snav{position:sticky;top:64px;padding:6px;background:var(--color-surface-raised);border:var(--th-border-card);border-radius:var(--th-radius-md)}
.snav .sn-title{font-size:11px;color:var(--color-fg-subtle);font-weight:600;letter-spacing:.5px;padding:8px 10px 4px}
.snav button{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 10px;border:none;background:none;
  border-radius:var(--th-radius-xs);font-size:13px;font-family:var(--th-font-cn);color:var(--color-fg);cursor:pointer;text-align:left}
.snav button i{font-size:14px;color:var(--color-fg-muted)}
.snav button:hover{background:var(--color-row-hover)}
.snav button.active{background:var(--color-accent-soft);color:var(--th-teal-600);font-weight:600}
.snav button.active i{color:var(--th-teal-600)}
.snav button .bdg{margin-left:auto;font-size:10px;min-width:16px;height:16px;padding:0 5px;border-radius:999px;
  background:var(--brand-50);color:var(--brand-600);display:inline-flex;align-items:center;justify-content:center;font-weight:600}

/* ================= 文档排版 ================= */
.doc{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--color-surface-raised);border:var(--th-border-card);border-radius:var(--th-radius-md)}
.doc-sec{padding:20px 24px}
.doc-sec h2{font-size:var(--th-text-lg);font-weight:700;margin:0 0 4px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.doc-sec h2 .ref{font-size:11px;font-weight:500;color:var(--brand-600);background:var(--brand-50);border-radius:var(--th-radius-xs);padding:2px 8px}
.doc-sec .lead{color:var(--color-fg-muted);font-size:13px;line-height:1.8;max-width:760px;margin:6px 0 0}
.doc-sec p{color:var(--color-fg-muted);line-height:1.8;margin:6px 0}
.doc-sec ul{padding-left:18px;color:var(--color-fg-muted);line-height:1.9;margin:6px 0}
.doc-sec b{color:var(--color-fg);font-weight:600}
.doc-sec code{background:var(--th-gray-50);border-radius:var(--th-radius-xs);padding:1px 5px;font-family:var(--th-font-mono);font-size:12px;color:var(--th-gray-800)}
.tbl{width:100%;border-collapse:collapse;margin-top:10px}
.tbl th{text-align:left;padding:8px 12px;font-size:12px;font-weight:500;color:var(--color-fg-muted);border-bottom:0.5px solid var(--color-border);white-space:nowrap}
.tbl td{padding:8px 12px;border-top:0.5px solid var(--color-border);font-size:13px;vertical-align:top;line-height:1.7;color:var(--color-fg)}
.tbl td.muted{color:var(--color-fg-muted)}
.tbl-wrap{overflow-x:auto}

.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:var(--th-radius-xs);font-size:var(--th-text-xs);white-space:nowrap;flex-shrink:0}
.tag i{font-size:12px}
.tag.t-neutral{background:var(--th-gray-50);color:var(--th-gray-600)}
.tag.t-teal{background:var(--th-teal-50);color:var(--th-teal-600)}
.tag.t-pink{background:var(--th-pink-50);color:var(--th-pink-600)}
.tag.t-warn{background:var(--color-warning-bg);color:var(--color-warning-fg)}
.tag.t-dark{background:var(--th-gray-50);color:var(--th-gray-800)}
.chip{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap;flex-shrink:0}
.chip i{font-size:12px}
.chip.c-success{background:var(--color-success-bg);color:var(--color-success-fg)}
.chip.c-warning{background:var(--color-warning-bg);color:var(--color-warning-fg)}
.chip.c-danger{background:var(--color-danger-bg);color:var(--color-danger-fg)}
.chip.c-info{background:var(--color-info-bg);color:var(--color-info-fg)}
.chip.c-neutral{background:var(--th-gray-50);color:var(--color-fg-muted)}

.chain{display:flex;align-items:center;gap:0;flex-wrap:wrap;margin:14px 0}
.chain .cn{padding:8px 14px;border-radius:var(--th-radius-sm);background:var(--color-surface-quiet);border:1px solid var(--color-border);
  font-weight:600;font-size:13px;display:flex;flex-direction:column;gap:2px}
.chain .cn small{font-weight:400;font-size:11px;color:var(--color-fg-muted)}
.chain .cn.hl{background:var(--brand-50);border-color:color-mix(in srgb,var(--brand-500) 35%,transparent);color:var(--brand-600)}
.chain .arr{color:var(--color-fg-subtle);font-size:16px;padding:0 6px}
.sm-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.sm-node{padding:4px 12px;border-radius:999px;font-size:12px;font-weight:500;background:var(--th-gray-50);color:var(--th-gray-800);border:1px solid transparent}
.sm-node.key{background:var(--color-success-bg);color:var(--color-success-fg)}
.sm-node.warn{background:var(--color-warning-bg);color:var(--color-warning-fg)}
.sm-node.err{background:var(--color-danger-bg);color:var(--color-danger-fg)}
.sm-node.brand{background:var(--brand-50);color:var(--brand-600)}
.sm-arr{color:var(--color-fg-subtle);font-size:12px}
.sm-note{font-size:11px;color:var(--color-fg-subtle);margin-left:4px}

/* ================= 链路模拟器（真实原型驱动） ================= */
.flow-head{display:flex;flex-direction:column;gap:12px}
.flow-chips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 14px;border-radius:var(--th-radius-pill);
  border:1px solid var(--color-border);background:var(--color-surface-raised);font-size:12px;cursor:pointer;font-family:var(--th-font-cn);color:var(--color-fg)}
.fchip i{font-size:14px;color:var(--color-fg-muted)}
.fchip:hover{border-color:var(--brand-400)}
.fchip.on{border-color:var(--brand-500);background:var(--brand-50);color:var(--brand-600);font-weight:600}
.fchip.on i{color:var(--brand-600)}
.flow-meta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--color-fg-muted);flex-wrap:wrap}

.stepper{display:flex;align-items:flex-start;gap:0;margin:6px 0 2px;overflow-x:auto;padding-bottom:4px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:110px;flex:1;cursor:pointer;position:relative}
.step .s-dot{width:26px;height:26px;border-radius:999px;background:var(--th-gray-50);color:var(--color-fg-subtle);
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;z-index:1;transition:all var(--th-dur-2) var(--th-ease)}
.step .s-label{font-size:11px;color:var(--color-fg-muted);text-align:center;line-height:1.4;max-width:120px}
.step .s-route{font-size:10px;color:var(--color-fg-subtle);font-family:var(--th-font-mono)}
.step::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--th-gray-100)}
.step:first-child::before{display:none}
.step.done .s-dot{background:var(--th-teal-50);color:var(--th-teal-600)}
.step.done::before{background:var(--th-teal-500)}
.step.now .s-dot{background:var(--brand-500);color:#fff;box-shadow:0 0 0 4px var(--brand-50)}
.step.now .s-label{color:var(--color-fg);font-weight:600}

.sim{display:grid;grid-template-columns:340px minmax(0,1fr);gap:12px;align-items:start}
/* 指引面板 */
.guide{padding:0;display:flex;flex-direction:column;overflow:hidden;position:sticky;top:64px;max-height:calc(100vh - 90px)}
.guide .g-head{padding:12px 14px;border-bottom:0.5px solid var(--color-border);display:flex;align-items:center;gap:8px;background:var(--color-surface-quiet)}
.guide .g-head b{font-size:13px}
.guide .g-head .g-step{margin-left:auto;font-size:11px;color:var(--color-fg-subtle);white-space:nowrap}
.guide .g-body{padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;font-size:13px}
.g-intro{color:var(--color-fg-muted);line-height:1.8;font-size:12px}
.g-item{border:1px solid var(--color-border);border-radius:var(--th-radius-sm);padding:10px 12px;cursor:pointer;transition:border-color var(--th-dur-1) var(--th-ease)}
.g-item:hover{border-color:var(--brand-400)}
.g-item.on{border-color:var(--brand-500);box-shadow:var(--th-ring)}
.g-item .gi-head{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.g-item .gi-head .n{width:18px;height:18px;border-radius:999px;background:var(--brand-500);color:#fff;font-size:10px;
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:700}
.g-item .gi-head .n.t{background:var(--th-teal-500)}
.g-item .gi-ref{margin-left:auto;font-size:10px;color:var(--brand-600);background:var(--brand-50);padding:2px 6px;border-radius:var(--th-radius-xs);white-space:nowrap}
.g-item .gi-body{font-size:12px;color:var(--color-fg-muted);line-height:1.8;margin-top:8px}
.g-item .gi-body ul{padding-left:16px;margin:4px 0}
.g-item .gi-body li{margin:3px 0}
.g-item .gi-edge{margin-top:8px;padding:8px 10px;border-radius:var(--th-radius-xs);background:var(--color-warning-bg);color:var(--color-warning-fg);font-size:11px;line-height:1.7}
.g-item .gi-edge b{display:block;margin-bottom:2px}
.g-adv{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 14px;margin-top:10px;border-radius:var(--th-radius-pill);
  border:none;background:var(--th-teal-500);color:#fff;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--th-font-cn)}
.g-adv:hover{background:var(--th-teal-600)}
.g-adv:disabled{opacity:.5;cursor:wait}
.g-adv i{font-size:13px}
.sim-nav{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:10px 2px 0}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 16px;font-size:13px;font-weight:500;font-family:var(--th-font-cn);
  border-radius:var(--th-radius-pill);border:1px solid transparent;cursor:pointer;user-select:none;white-space:nowrap;line-height:1}
.btn.primary{background:var(--color-cta);color:var(--color-cta-fg)}
.btn.primary:hover:not(:disabled){background:color-mix(in srgb, var(--color-cta) 88%, black)}
.btn.secondary{background:var(--color-surface-quiet);color:var(--color-fg)}
.btn.secondary:hover:not(:disabled){background:var(--color-surface-inset)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{height:28px;padding:0 12px;font-size:12px}
.btn i{font-size:14px}

/* 原型舞台 */
.stage-col{display:flex;flex-direction:column;gap:10px;min-width:0}
.stage-bar{display:flex;align-items:center;gap:10px;padding:8px 12px}
.stage-bar .sb-route{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--color-fg-muted)}
.stage-bar .sb-route .dot{width:8px;height:8px;border-radius:999px;background:var(--color-success-fg)}
.stage-bar .sb-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.legend{display:flex;gap:14px;font-size:11px;color:var(--color-fg-muted);align-items:center;padding:0 12px 10px;flex-wrap:wrap}
.legend .lg{display:inline-flex;align-items:center;gap:5px}
.legend .dot{width:14px;height:14px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:#fff;font-weight:700}
.legend .dot.b{background:var(--brand-500)}
.legend .dot.t{background:var(--th-teal-500)}

.frame-wrap{position:relative;border:var(--th-border-card);border-radius:var(--th-radius-md);overflow:hidden;background:#fff;height:calc(100vh - 320px);min-height:520px}
.frame-wrap iframe{width:100%;height:100%;border:0;display:block}
.pin-layer{position:absolute;inset:0;pointer-events:none;z-index:10}
.pin{position:absolute;width:22px;height:22px;border-radius:999px;background:var(--brand-500);color:#fff;border:2px solid #fff;
  display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:pointer;
  box-shadow:0 1px 6px rgba(0,0,0,.3);transform:translate(-50%,-50%);transition:transform var(--th-dur-1) var(--th-ease),opacity var(--th-dur-1) var(--th-ease);pointer-events:auto}
.pin:hover{transform:translate(-50%,-50%) scale(1.18)}
.pin::after{content:"";position:absolute;inset:-6px;border-radius:999px;border:2px solid var(--brand-500);opacity:.35;animation:pin-pulse 2s ease-out infinite}
.pin.sel{background:var(--th-gray-900);transform:translate(-50%,-50%) scale(1.12)}
.pin.sel::after{display:none}
.pin.go{background:var(--th-teal-500)}
.pin.go::after{border-color:var(--th-teal-500)}
.pin.hidden{opacity:0;pointer-events:none}
@keyframes pin-pulse{0%{transform:scale(.6);opacity:.5}70%{transform:scale(1.15);opacity:0}100%{opacity:0}}
.frame-loading{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;
  background:var(--th-bg);color:var(--color-fg-muted);font-size:12px;z-index:5}
.frame-loading i{font-size:22px;color:var(--brand-500);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.frame-err{position:absolute;inset:0;display:none;flex-direction:column;gap:8px;align-items:center;justify-content:center;
  background:var(--th-bg);color:var(--color-fg-muted);font-size:12px;z-index:6;text-align:center;padding:20px;line-height:1.8}

.flow-done{padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.flow-done .fd-icon{width:48px;height:48px;border-radius:999px;background:var(--th-teal-50);color:var(--th-teal-600);display:inline-flex;align-items:center;justify-content:center;font-size:22px}
.flow-done b{font-size:14px}
.flow-done p{font-size:12px;color:var(--color-fg-muted);max-width:460px;line-height:1.8;margin:0}

@media(max-width:1080px){
  .layout{grid-template-columns:1fr}
  .snav{position:static;display:flex;flex-wrap:wrap}
  .sim{grid-template-columns:1fr}
  .guide{position:static;max-height:none;order:2}
  .frame-wrap{height:70vh}
}
</style>
</head>
<body>

<header class="topbar">
  <span class="tb-tile"><i class="ri-file-list-3-line"></i></span>
  <span class="tb-title">Marketplace · 交互式 PRD</span>
  <span class="tb-sub">在高保真原型上标注的链路指引</span>
  <div class="tb-right">
    <a class="tb-link" href="marketplace.html" target="_blank"><i class="ri-window-line"></i>打开高保真原型</a>
    <a class="tb-link" href="PRD｜Marketplace.md" target="_blank"><i class="ri-file-text-line"></i>PRD 原文</a>
  </div>
</header>

<div class="layout">
  <nav class="snav" id="snav"></nav>
  <main class="doc" id="doc"></main>
</div>

<script>
/* ======================================================================
 * 交互式 PRD：直接驱动高保真原型 marketplace.html（iframe 同源）
 * 热点标注真实 DOM 元素；青色热点在原型中真实执行动作
 * ==================================================================== */
const $=s=>document.querySelector(s);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function until(cond,timeout=6000,step=150){const t0=Date.now();while(Date.now()-t0<timeout){try{if(cond())return true}catch(e){}await sleep(step)}return false}

/* ---------------- 原型 Frame 操作 ---------------- */
const FW={
  el:null,
  doc(){try{return this.el&&this.el.contentDocument}catch(e){return null}},
  hash(){try{return this.el.contentWindow.location.hash||'#/market'}catch(e){return ''}},
  nav(route){try{const w=this.el.contentWindow;if(!w)return;
    if(w.location.hash===route){return}
    w.location.hash=route}catch(e){}},
  find(sel,text){const d=this.doc();if(!d)return null;const els=[...d.querySelectorAll(sel)];
    if(!text)return els[0]||null;return els.find(e=>e.textContent.includes(text))||null},
  click(sel,text){const el=this.find(sel,text);if(el){el.click();return true}return false},
  reload(){try{this.el.contentWindow.location.href='marketplace.html#/market';this.el.contentWindow.location.reload()}catch(e){this.el.src='marketplace.html#/market'}},
};
async function runOps(ops){for(const op of ops||[]){
  if(op.hash)FW.nav(op.hash);
  else if(op.click)FW.click(op.click,op.text);
  else if(op.wait)await sleep(op.wait);
  if(op.thenWait)await sleep(op.thenWait);else if(!op.wait)await sleep(120);
}}

/* ---------------- 链路数据（选择器指向真实原型 DOM） ---------------- */
const FLOWS=[
{id:'A',icon:'ri-compass-3-line',name:'发现与安装闭环',roles:'普通成员',ref:'§7 · §8 · §12.1',
 desc:'成员在市场找到内容 → 详情页看清风险 → 点安装 → IDE 接手完成真正的安装。',
 steps:[
  {title:'市场首页 · 发现',route:'#/market',
   intro:'市场首页负责「找内容」：按类型浏览、搜索、按来源 / 签发方 / 安装策略筛选。搜索和筛选条件会同步进网址，可分享、返回后不丢失。',
   spots:[
    {sel:'#market-q',title:'搜索框',ref:'PRD §7.3',
     body:['输入关键词后稍等片刻（250ms）自动搜索，关键词同步进网址。','从详情页返回市场时，搜索词、筛选和滚动位置都恢复成离开时的样子。'],
     edge:'没有结果时给出空状态和「清空搜索与筛选」入口，不会一直转圈加载。'},
    {sel:'.tabs',corner:'tl',title:'类型目录',ref:'PRD §7.1',
     body:['五种内容（Skill / Plugin / Rule / Prompt / Template）在同一个市场里，用 Tab 切换。','Tab 上的数量会跟着搜索和筛选条件实时变化。']},
    {sel:'.filter-group[data-fg="source"] > button',title:'筛选组',ref:'PRD §7.3',
     body:['可按来源生态、签发方、安装策略多选组合筛选，选中项同样同步进网址。','来源生态（企业官方 / InfCode / Claude / 第三方）是判断内容可信度的第一层标识。']},
    {sel:'.card-grid .m-card',title:'内容卡片',ref:'PRD §7.4',
     body:['卡片底部只会出现三种状态之一：「不兼容」、「已安装（含装到了哪里）」、「去安装」按钮。','「已安装」来自 IDE 同步回来的真实安装状态，网页自己不记第二份。','收藏 ≠ 安装：点星标只是收藏，不会触发任何安装动作。']},
    {sel:'.card-grid .m-card h3',go:true,title:'卡片标题 → 进入详情',ref:'PRD §8.1',
     body:['点标题进入详情页——安装前先把风险看清楚。','从详情页返回时，市场的搜索和筛选原样保留。'],
     action:[{click:'.card-grid .m-card h3'}],
     nextLabel:'进入「需求转测试用例」详情页 →'},

const snav=document.getElementById('snav');
let curSection='overview';
let curFlow=0, curStep=0, selSpot=-1;
let flowsRoot=null, pinLayer=null, frameEl=null, activating=false;

function renderSnav(){
  snav.innerHTML=`<div class="sn-title">PRD 章节</div>`+SECTIONS.map(s=>
    `<button class="${s.id===curSection?'active':''}" data-sec="${s.id}"><i class="${s.icon}"></i>${s.name}${s.badge?`<span class="bdg">${s.badge}</span>`:''}</button>`).join('');
  snav.querySelectorAll('button').forEach(b=>b.onclick=()=>{curSection=b.dataset.sec;render();window.scrollTo({top:0});});
}

function render(){
  renderSnav();
  doc.innerHTML='';
  if(curSection==='flows'){ mountFlows(); }
  else doc.innerHTML=STATIC[curSection]();
}

/* ---------------- 链路模拟：挂载持久容器（iframe 状态不丢） ---------------- */
function mountFlows(){
  if(!flowsRoot){
    flowsRoot=document.createElement('div');
    flowsRoot.className='doc';
    flowsRoot.innerHTML=`
    <div class="card doc-sec flow-head">
      <h2>链路模拟 <span class="ref">真实原型驱动</span></h2>
      <p class="lead">右侧为嵌入的高保真原型（marketplace.html）。蓝色热点标注真实界面元素，点击查看 PRD 指引；青色热点会在原型中<b>真实执行操作</b>并推进链路。</p>
      <div class="flow-chips" id="fchips"></div>
      <div class="flow-meta" id="fmeta"></div>
    </div>
    <div class="card doc-sec"><div class="stepper" id="stepper"></div></div>
    <div id="sim-slot"></div>`;
    const fc=flowsRoot.querySelector('#fchips');
    fc.innerHTML=FLOWS.map((fl,i)=>`<button class="fchip" data-f="${i}"><i class="${fl.icon}"></i>链路${fl.id} · ${fl.name}</button>`).join('');
    fc.querySelectorAll('.fchip').forEach(b=>b.onclick=()=>{selectFlow(+b.dataset.f);});
  }
  doc.appendChild(flowsRoot);
  renderFlowHead();
  renderStepper();
  renderSimSlot();
}

function renderFlowHead(){
  const f=FLOWS[curFlow];
  flowsRoot.querySelectorAll('.fchip').forEach((b,i)=>b.classList.toggle('on',i===curFlow));
  flowsRoot.querySelector('#fmeta').innerHTML=`<span><i class="ri-user-line"></i> 参与角色：${f.roles}</span><span class="mono">${f.ref}</span><span style="flex:1"></span><span>${f.desc}</span>`;
}

function renderStepper(){
  const f=FLOWS[curFlow];
  const done=curStep>=f.steps.length;
  $('#stepper').innerHTML=f.steps.map((s,i)=>`
    <div class="step ${done||i<curStep?'done':''} ${i===curStep&&!done?'now':''}" data-s="${i}">
      <span class="s-dot">${done||i<curStep?'<i class="ri-check-line"></i>':i+1}</span>
      <span class="s-label">${s.title}</span><span class="s-route">${s.route||'弹窗 / 当前页'}</span></div>`).join('')
    +`<div class="step ${done?'now':''}" data-s="${f.steps.length}"><span class="s-dot"><i class="ri-flag-line"></i></span><span class="s-label">完成</span></div>`;
  $('#stepper').querySelectorAll('.step').forEach(s=>s.onclick=()=>{selectStep(+s.dataset.s);});
}

let simLive=null;
function renderSimSlot(){
  const slot=flowsRoot.querySelector('#sim-slot');
  const f=FLOWS[curFlow];
  const done=curStep>=f.steps.length;
  let doneEl=slot.querySelector('#done-slot');
  if(done){
    if(simLive) simLive.style.display='none';
    if(!doneEl){doneEl=document.createElement('div');doneEl.id='done-slot';slot.appendChild(doneEl);}
    doneEl.style.display='';
    doneEl.innerHTML=`<div class="card flow-done">
      <span class="fd-icon"><i class="ri-checkbox-circle-line"></i></span>
      <b>链路${f.id} · ${f.name} — 已完成</b>
      <p>${f.desc}</p>
      <div style="display:flex;gap:8px">
        <button class="btn secondary" id="restart"><i class="ri-restart-line"></i>重新走一遍</button>
        ${FLOWS[curFlow+1]?`<button class="btn primary" id="nextflow">下一条链路：${FLOWS[curFlow+1].name}<i class="ri-arrow-right-line"></i></button>`:''}
      </div></div>`;
    doneEl.querySelector('#restart').onclick=()=>selectStep(0);
    const nf=doneEl.querySelector('#nextflow'); if(nf)nf.onclick=()=>selectFlow(curFlow+1);
    return;
  }
  if(doneEl) doneEl.style.display='none';
  if(!simLive){
    simLive=document.createElement('div');
    simLive.innerHTML=`<div class="sim">
    <div class="card guide">
      <div class="g-head"><i class="ri-lightbulb-line" style="color:var(--brand-500)"></i><b>PRD 交互指引</b><span class="g-step" id="gstep"></span></div>
      <div class="g-body" id="gbody"></div>
    </div>
    <div class="stage-col">
      <div class="card">
        <div class="stage-bar">
          <span class="sb-route"><span class="dot"></span><i class="ri-window-line"></i>高保真原型 · 实时联动 <span class="mono" id="route-echo"></span></span>
          <span class="sb-right">
            <button class="btn secondary sm" id="reset-proto"><i class="ri-restart-line"></i>重置原型</button>
          </span>
        </div>
        <div class="legend">
          <span class="lg"><span class="dot b">n</span>交互指引热点（标注真实元素，点击查看）</span>
          <span class="lg"><span class="dot t"><i class="ri-flashlight-line" style="font-size:9px"></i></span>关键操作（在原型中真实执行并推进）</span>
        </div>
      </div>
      <div class="frame-wrap" id="frame-wrap">
        <div class="frame-loading" id="frame-loading"><i class="ri-loader-4-line"></i>正在加载高保真原型…</div>
        <div class="frame-err" id="frame-err"><i class="ri-error-warning-line" style="font-size:22px;color:var(--color-warning-fg)"></i>
          <div>无法访问原型页面（跨域限制）。<br>请通过 InfCode 浏览器或本地 HTTP 服务打开本页面，而不是 file:// 直接双击打开。</div></div>
        <div class="pin-layer" id="pin-layer"></div>
      </div>
      <div class="sim-nav">
        <button class="btn secondary sm" id="prev"><i class="ri-arrow-left-line"></i>上一步</button>
        <span style="font-size:11px;color:var(--color-fg-subtle)">提示：青色热点即本步关键操作，会在原型中真实执行</span>
        <button class="btn primary sm" id="next">跳过此步<i class="ri-arrow-right-line"></i></button>
      </div>
    </div>
  </div>`;
    slot.appendChild(simLive);
    /* iframe 只创建一次且不再移动（移动会触发重载丢状态） */
    const wrap=simLive.querySelector('#frame-wrap');
    frameEl=document.createElement('iframe');
    frameEl.src='marketplace.html#/market';
    FW.el=frameEl;
    frameEl.addEventListener('load',()=>{ const l=simLive.querySelector('#frame-loading'); if(l)l.style.display='none'; scrollBound=false; bindFrameScroll(); activateStep(); });
    wrap.insertBefore(frameEl,simLive.querySelector('#pin-layer'));
    pinLayer=simLive.querySelector('#pin-layer');
    simLive.querySelector('#reset-proto').onclick=()=>{ const l=simLive.querySelector('#frame-loading'); if(l)l.style.display='flex'; FW.reload(); selSpot=-1; };
    simLive.querySelector('#prev').onclick=()=>selectStep(curStep-1);
    simLive.querySelector('#next').onclick=()=>selectStep(curStep+1);
  }
  simLive.style.display='';
  simLive.querySelector('#prev').disabled=curStep===0;
  if(frameEl.contentDocument&&frameEl.contentDocument.readyState==='complete'){
    const l=simLive.querySelector('#frame-loading'); if(l)l.style.display='none';
    bindFrameScroll();
    activateStep();
  }
}

/* ---------------- 步骤激活：导航 → 准备动作 → 等待就绪 → 布点 ---------------- */
async function activateStep(){
  if(activating) return; activating=true;
  try{
    const f=FLOWS[curFlow]; if(curStep>=f.steps.length) return;
    const s=f.steps[curStep];
    selSpot=-1;
    renderGuide(s);
    drawPins(s,true);
    /* 同源检测 */
    if(!FW.doc()){ const e=$('#frame-err'); if(e)e.style.display='flex'; return }
    const e=$('#frame-err'); if(e)e.style.display='none';
    if(s.route) FW.nav(s.route);
    await sleep(200);
    await runOps(s.enter);
    const timeout=s.readyTimeout||7000;
    if(s.readyAny) await until(()=>s.readyAny.some(sel=>FW.find(sel)),timeout);
    else await until(()=>(s.ready||s.spots.map(p=>p.sel)).every(sel=>FW.find(sel,s.spots.find(p=>p.sel===sel)&&p.text)),timeout);
    drawPins(s);
    /* 若当前视口内没有任何热点，仅滚动 iframe 使首个热点可见（不牵动外链路面板） */
    const anyVisible=[...pinLayer.querySelectorAll('.pin')].some(pn=>!pn.classList.contains('hidden'));
    if(!anyVisible){const el=FW.find(s.spots[0].sel,s.spots[0].text); if(el) fwScrollTo(el);}
    updateRouteEcho();
  } finally { activating=false; }
}

function updateRouteEcho(){ const r=$('#route-echo'); if(r) r.textContent=FW.hash(); }

function fwScrollTo(el){
  try{
    const w=FW.el.contentWindow;
    const r=el.getBoundingClientRect();
    const y=r.top+w.scrollY-w.innerHeight/2+r.height/2;
    w.scrollTo({top:Math.max(y,0),behavior:'smooth'});
    setTimeout(()=>positionPins(),400);
    setTimeout(()=>positionPins(),800);
  }catch(e){}
}

/* ---------------- 热点绘制 ---------------- */
function drawPins(s,loading){
  if(!pinLayer) return;
  pinLayer.innerHTML=s.spots.map((p,i)=>
    `<span class="pin ${p.go?'go':''} ${i===selSpot?'sel':''} ${loading?'hidden':''}" data-i="${i}">${p.go?'<i class="ri-flashlight-line" style="font-size:10px"></i>':i+1}</span>`).join('');
  pinLayer.querySelectorAll('.pin').forEach(pn=>pn.onclick=()=>toggleSpot(+pn.dataset.i));
  positionPins(s);
}

function positionPins(s){
  if(!pinLayer||!FW.doc()) return;
  s=s||FLOWS[curFlow].steps[curStep]; if(!s) return;
  const vh=FW.el.contentWindow.innerHeight||800;
  pinLayer.querySelectorAll('.pin').forEach((pn,i)=>{
    const p=s.spots[i];
    const el=FW.find(p.sel,p.text);
    if(!el){pn.classList.add('hidden');return}
    const r=el.getBoundingClientRect();
    if((r.width===0&&r.height===0)||r.bottom<0||r.top>vh){pn.classList.add('hidden');return}
    pn.classList.remove('hidden');
    pn.style.left=(p.corner==='tl'?r.left:r.right)+'px';
    pn.style.top=r.top+'px';
  });
}

/* 原型内部滚动 / 尺寸变化时跟随 */
let scrollBound=false;
function bindFrameScroll(){
  if(scrollBound||!FW.el) return;
  try{
    FW.el.contentWindow.addEventListener('scroll',()=>positionPins(),true);
    FW.el.contentWindow.addEventListener('resize',()=>positionPins());
    scrollBound=true;
  }catch(e){}
}
setInterval(()=>{ if(curSection==='flows'&&pinLayer&&FW.doc()){positionPins();updateRouteEcho();} },700);

/* ---------------- 指引面板 ---------------- */
function renderGuide(s){
  const f=FLOWS[curFlow];
  $('#gstep').textContent=`${f.name} · ${curStep+1}/${f.steps.length}`;
  $('#gbody').innerHTML=`<div class="g-intro"><b style="color:var(--color-fg)">本步说明</b>：${s.intro}</div>`
    +s.spots.map((p,i)=>spotHTML(p,i,i===selSpot)).join('');
  bindGuideEvents(s);
}

function spotHTML(p,i,open){
  return `<div class="g-item ${open?'on':''}" data-i="${i}">
    <div class="gi-head"><span class="n ${p.go?'t':''}">${p.go?'<i class="ri-flashlight-line" style="font-size:9px"></i>':i+1}</span>${p.title}<span class="gi-ref">${p.ref}</span></div>
    ${open?`<div class="gi-body"><ul>${p.body.map(r=>`<li>${r}</li>`).join('')}</ul>
      ${p.edge?`<div class="gi-edge"><b><i class="ri-error-warning-line"></i> 异常与边界</b>${p.edge}</div>`:''}
      ${p.go?`<button class="g-adv" data-adv="${i}">${p.nextLabel||'执行此操作，进入下一步'}<i class="ri-arrow-right-line"></i></button>`:''}
    </div>`:''}
  </div>`;
}

function bindGuideEvents(s){
  $('#gbody').querySelectorAll('.g-item .gi-head').forEach(h=>h.onclick=()=>toggleSpot(+h.parentElement.dataset.i));
  const adv=$('#gbody').querySelector('[data-adv]');
  if(adv) adv.onclick=async e=>{
    e.stopPropagation();
    const p=s.spots[+adv.dataset.adv];
    adv.disabled=true; adv.innerHTML='<i class="ri-loader-4-line"></i>正在原型中执行…';
    await runOps(p.action);
    selectStep(curStep+1);
  };
}

function toggleSpot(i){
  selSpot=(selSpot===i)?-1:i;
  const s=FLOWS[curFlow].steps[curStep];
  renderGuide(s);
  if(pinLayer) pinLayer.querySelectorAll('.pin').forEach((pn,pi)=>pn.classList.toggle('sel',pi===selSpot));
  /* 滚动到对应元素（只滚动 iframe 内部） */
  if(selSpot>=0){const p=s.spots[selSpot];const el=FW.find(p.sel,p.text);
    if(el) fwScrollTo(el);}
}

/* ---------------- 导航控制 ---------------- */
function selectFlow(i){curFlow=i;curStep=0;selSpot=-1;renderFlowHead();renderStepper();renderSimSlot();}
function selectStep(i){
  const f=FLOWS[curFlow];
  curStep=Math.max(0,Math.min(i,f.steps.length));
  selSpot=-1;renderStepper();renderSimSlot();
}

render();
</script>
</body>
</html>
